# Render blueprint: one Node web service. Secrets are entered in the Render dashboard, not here.
services:
  - type: web
    name: runway
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: AG_STUDIO
        sync: false
      - key: GEMINI_API_KEY
        sync: false
